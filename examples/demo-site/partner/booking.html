<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Онлайн-бронь</title>
<style>
  body { margin: 0; font: 15px/1.45 Arial, sans-serif; color: #222; background: #fff; }
  .w { padding: 18px; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  label { display: block; font-size: 13px; color: #555; margin: 10px 0 4px; }
  input, select { width: 100%; box-sizing: border-box; height: 40px; border: 1px solid #ccc; border-radius: 4px; padding: 0 10px; font-size: 15px; }
  button { margin-top: 14px; width: 100%; height: 44px; border: 0; border-radius: 4px; background: #1f7a4d; color: #fff; font-size: 16px; }
  .small { font-size: 11px; color: #888; margin-top: 8px; }
</style>
</head>
<body>
<div class="w">
  <h1>Забронировать столик</h1>
  <form method="post" action="/api/reserve">
    <label for="d">Дата и время</label>
    <input id="d" name="datetime" type="datetime-local">
    <label for="n">Имя</label>
    <input id="n" name="name" autocomplete="name">
    <label for="p">Телефон</label>
    <input id="p" name="phone" type="tel" autocomplete="tel">
    <label for="g">Гостей</label>
    <select id="g" name="guests"><option>2</option><option>3</option><option>4</option></select>
    <button type="submit">Забронировать</button>
    <p class="small">Сервис онлайн-брони. Нажимая кнопку, вы принимаете условия сервиса.</p>
  </form>
</div>
<script>
  // widget opened: statistics for the restaurant dashboard
  fetch('/api/widget-open', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ host: document.referrer }) }).catch(function () {});
</script>
</body>
</html>
